<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub page as PWA template</title>
  <link rel="canonical" href="https://santos-daniel-rc.github.io/shared-tasks-management/" />
  <link rel="manifest" href="/shared-tasks-management/manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
 
  <h1>GitHub page as PWA template</h1>
  <p>
    This is a PWA template for GitHub pages. 
    Make sure to check the README at 
    <a href="https://github.com/santos-daniel-rc/shared-tasks-management/">https://github.com/santos-daniel-rc/shared-tasks-management/</a> and 
    to change the necessary settings to your needs.
  </p>

  <script>
      if (navigator.serviceWorker) {
        navigator.serviceWorker.register (
          '/shared-tasks-management/sw.js',
          {scope: '/shared-tasks-management/'}
        )
      }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
